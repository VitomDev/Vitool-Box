<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src https://api.github.com https://raw.githubusercontent.com">
  <title>Vitool Box</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button back" id="back" data-i18n-title="back" hidden>
      <svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5" /></svg>
    </button>
    <div class="brand">
      <img src="logo.png" alt="">
      <span>Vitool Box</span>
      <small class="brand-version" id="brand-version"></small>
    </div>
    <input class="search" id="search" type="search" data-i18n-placeholder="search" autocomplete="off">
    <button class="icon-button" id="refresh" data-i18n-title="refresh">
      <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" /></svg>
    </button>
    <button class="icon-button" id="open-settings" data-i18n-title="settings">
      <svg viewBox="0 0 16 16"><path d="M13.14 6.33 L14.85 6.58 L14.85 9.42 L13.14 9.67 L12.81 10.45 L13.85 11.84 L11.84 13.85 L10.45 12.81 L9.67 13.14 L9.42 14.85 L6.58 14.85 L6.33 13.14 L5.55 12.81 L4.16 13.85 L2.15 11.84 L3.19 10.45 L2.86 9.67 L1.15 9.42 L1.15 6.58 L2.86 6.33 L3.19 5.55 L2.15 4.16 L4.16 2.15 L5.55 3.19 L6.33 2.86 L6.58 1.15 L9.42 1.15 L9.67 2.86 L10.45 3.19 L11.84 2.15 L13.85 4.16 L12.81 5.55Z" /><circle cx="8" cy="8" r="2.2" /></svg>
    </button>
  </header>

  <div class="banner" id="banner" hidden></div>

  <main>
    <section id="home">
      <div class="filters">
        <div class="chips" role="tablist">
          <button class="chip active" data-filter="all" data-i18n="all"></button>
          <button class="chip" data-filter="installed" data-i18n="installed"></button>
          <button class="chip" data-filter="updates" data-i18n="updates"></button>
        </div>
        <select class="select" id="category"></select>
        <select class="select" id="sort">
          <option value="name" data-i18n="sortName"></option>
          <option value="newest" data-i18n="sortNewest"></option>
          <option value="updated" data-i18n="sortUpdated"></option>
          <option value="installed" data-i18n="sortInstalled"></option>
        </select>
        <span class="spacer"></span>
        <button class="button" id="select-mode" data-i18n="select"></button>
        <button class="button primary" id="update-all" data-i18n="updateAll" hidden></button>
      </div>
      <div class="selection-bar" id="selection-bar" hidden>
        <span id="selection-text"></span>
        <span class="spacer"></span>
        <button class="button" id="selection-cancel" data-i18n="cancel"></button>
        <button class="button primary" id="selection-install" data-i18n="installSelected"></button>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden></p>
      <footer class="credits"><a href="#" id="credits"></a></footer>
    </section>

    <section id="detail" hidden></section>

    <section id="settings" hidden></section>
  </main>

  <div class="dialog-backdrop" id="dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <div class="dialog-buttons">
        <button class="button" id="dialog-cancel" data-i18n="cancel"></button>
        <button class="button danger" id="dialog-ok"></button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" hidden><img alt=""></div>

  <script src="i18n.js" charset="utf-8"></script>
  <script src="app.js" charset="utf-8"></script>
</body>
</html>
